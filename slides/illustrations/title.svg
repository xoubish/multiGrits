<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <g fill="#e8edf2" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground line -->
    <line x1="60" y1="400" x2="740" y2="400" fill="none"/>

    <!-- telescope on tripod, left -->
    <line x1="120" y1="400" x2="150" y2="300" fill="none"/>
    <line x1="180" y1="400" x2="150" y2="300" fill="none"/>
    <line x1="150" y1="400" x2="150" y2="300" fill="none"/>
    <rect x="88" y="240" width="150" height="40" rx="14" transform="rotate(-30 163 260)"/>
    <!-- star the telescope points at -->
    <polygon points="70,90 78,112 100,112 82,125 88,148 70,134 52,148 58,125 40,112 62,112"/>

    <!-- centre figure (the person) -->
    <circle cx="400" cy="215" r="34"/>
    <path d="M340 400 V320 a60 60 0 0 1 120 0 V400 Z"/>

    <!-- agent window, left of person -->
    <rect x="250" y="150" width="120" height="90" rx="12"/>
    <line x1="250" y1="176" x2="370" y2="176" fill="none"/>
    <line x1="270" y1="200" x2="330" y2="200" fill="none"/>
    <line x1="270" y1="220" x2="310" y2="220" fill="none"/>

    <!-- agent window, right of person -->
    <rect x="430" y="150" width="120" height="90" rx="12"/>
    <line x1="430" y1="176" x2="550" y2="176" fill="none"/>
    <line x1="450" y1="200" x2="510" y2="200" fill="none"/>
    <line x1="450" y1="220" x2="490" y2="220" fill="none"/>

    <!-- agent window, further right -->
    <rect x="590" y="150" width="120" height="90" rx="12"/>
    <line x1="590" y1="176" x2="710" y2="176" fill="none"/>
    <line x1="610" y1="200" x2="670" y2="200" fill="none"/>
    <line x1="610" y1="220" x2="650" y2="220" fill="none"/>

    <!-- hand-off arrows between windows -->
    <line x1="376" y1="290" x2="424" y2="290" fill="none"/>
    <polygon points="424,282 440,290 424,298" fill="#1e3a5f"/>
    <line x1="556" y1="290" x2="584" y2="290" fill="none"/>
    <polygon points="584,282 600,290 584,298" fill="#1e3a5f"/>
    <line x1="310" y1="246" x2="310" y2="284" fill="none"/>
    <line x1="490" y1="246" x2="490" y2="284" fill="none"/>
    <line x1="650" y1="246" x2="650" y2="284" fill="none"/>
    <line x1="310" y1="290" x2="376" y2="290" fill="none"/>
    <line x1="490" y1="290" x2="556" y2="290" fill="none"/>
  </g>
</svg>
