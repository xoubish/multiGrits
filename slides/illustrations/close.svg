<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <g fill="#e8edf2" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <line x1="40" y1="410" x2="760" y2="410" fill="none"/>

    <!-- one person -->
    <circle cx="180" cy="230" r="34"/>
    <path d="M120 410 V330 a60 60 0 0 1 120 0 V410 Z"/>
    <!-- arm handing over one small card -->
    <line x1="236" y1="320" x2="300" y2="290" fill="none"/>
    <rect x="290" y="268" width="60" height="40" rx="6"/>

    <!-- hand-off arrow to the agent -->
    <line x1="360" y1="288" x2="440" y2="288" fill="none"/>
    <polygon points="438,278 458,288 438,298" fill="#1e3a5f"/>

    <!-- one small agent window -->
    <rect x="470" y="220" width="150" height="120" rx="14"/>
    <line x1="470" y1="250" x2="620" y2="250" fill="none"/>
    <circle cx="515" cy="292" r="8" fill="#1e3a5f" stroke="none"/>
    <circle cx="575" cy="292" r="8" fill="#1e3a5f" stroke="none"/>
    <!-- a padlock on it: read-only -->
    <rect x="655" y="290" width="44" height="36" rx="6"/>
    <path d="M663 290 V276 a14 14 0 0 1 28 0 V290" fill="none"/>

    <!-- return arrow underneath: a short summary comes back -->
    <path d="M545 346 V380 H300 V330" fill="none"/>
    <polygon points="290,334 300,314 310,334" fill="#1e3a5f"/>
    <rect x="400" y="362" width="60" height="36" rx="6"/>
    <line x1="414" y1="380" x2="446" y2="380" fill="none"/>

    <!-- one star overhead: the one bounded task -->
    <polygon points="545,60 553,82 575,82 557,95 563,118 545,104 527,118 533,95 515,82 537,82"/>
    <!-- small moon, right -->
    <path d="M700 80 a44 44 0 1 0 0 88 a34 34 0 1 1 0 -88 Z"/>
  </g>
</svg>
