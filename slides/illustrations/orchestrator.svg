<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 120 720 300">
  <g fill="#e8edf2" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- desk -->
    <line x1="70" y1="340" x2="730" y2="340" fill="none"/>
    <line x1="120" y1="340" x2="110" y2="410" fill="none"/>
    <line x1="680" y1="340" x2="690" y2="410" fill="none"/>

    <!-- ROBOT behind the desk, arms to both laptops -->
    <rect x="340" y="230" width="120" height="110" rx="12"/>
    <line x1="370" y1="275" x2="430" y2="275" fill="none"/>
    <rect x="352" y="160" width="96" height="66" rx="10"/>
    <line x1="362" y1="178" x2="438" y2="178" fill="none"/>
    <circle cx="380" cy="204" r="6" fill="#1e3a5f"/>
    <circle cx="420" cy="204" r="6" fill="#1e3a5f"/>
    <line x1="400" y1="160" x2="400" y2="142" fill="none"/>
    <circle cx="400" cy="135" r="7"/>
    <line x1="340" y1="260" x2="250" y2="318" fill="none"/>
    <line x1="460" y1="260" x2="550" y2="318" fill="none"/>

    <!-- LEFT laptop: base on the desk, screen open toward the robot -->
    <rect x="140" y="322" width="120" height="16" rx="4"/>
    <rect x="150" y="236" width="104" height="82" rx="6" transform="skewX(-6)"/>
    <line x1="174" y1="258" x2="222" y2="258" fill="none" stroke-width="4"/>
    <line x1="172" y1="276" x2="212" y2="276" fill="none" stroke-width="4"/>
    <line x1="170" y1="294" x2="204" y2="294" fill="none" stroke-width="4"/>

    <!-- RIGHT laptop -->
    <rect x="540" y="322" width="120" height="16" rx="4"/>
    <rect x="556" y="236" width="104" height="82" rx="6" transform="skewX(6)"/>
    <line x1="590" y1="258" x2="638" y2="258" fill="none" stroke-width="4"/>
    <line x1="592" y1="276" x2="632" y2="276" fill="none" stroke-width="4"/>
    <line x1="594" y1="294" x2="628" y2="294" fill="none" stroke-width="4"/>
  </g>
</svg>
