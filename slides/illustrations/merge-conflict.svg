<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <g fill="#e8edf2" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <line x1="40" y1="410" x2="760" y2="410" fill="none"/>

    <!-- left agent (a window with a head, so it reads as an agent, not a person) -->
    <rect x="70" y="150" width="140" height="110" rx="14"/>
    <line x1="70" y1="180" x2="210" y2="180" fill="none"/>
    <circle cx="110" cy="220" r="8" fill="#1e3a5f" stroke="none"/>
    <circle cx="170" cy="220" r="8" fill="#1e3a5f" stroke="none"/>
    <!-- its pen / write arrow toward the file -->
    <line x1="216" y1="250" x2="300" y2="300" fill="none"/>
    <polygon points="296,288 316,310 288,306" fill="#1e3a5f"/>

    <!-- right agent -->
    <rect x="590" y="150" width="140" height="110" rx="14"/>
    <line x1="590" y1="180" x2="730" y2="180" fill="none"/>
    <circle cx="630" cy="220" r="8" fill="#1e3a5f" stroke="none"/>
    <circle cx="690" cy="220" r="8" fill="#1e3a5f" stroke="none"/>
    <line x1="584" y1="250" x2="500" y2="300" fill="none"/>
    <polygon points="504,288 484,310 512,306" fill="#1e3a5f"/>

    <!-- the one shared file: a page with a folded corner -->
    <path d="M320 240 H440 L480 280 V410 H320 Z"/>
    <path d="M440 240 V280 H480" fill="none"/>
    <!-- lines written from the left, and from the right, overlapping -->
    <line x1="340" y1="310" x2="400" y2="310" fill="none"/>
    <line x1="340" y1="340" x2="410" y2="340" fill="none"/>
    <line x1="400" y1="325" x2="460" y2="325" fill="none"/>
    <line x1="390" y1="355" x2="460" y2="355" fill="none"/>
    <!-- crack down the middle of the page -->
    <polyline points="405,236 385,290 420,330 390,380 410,414" fill="none" stroke-width="7"/>

    <!-- small spark above the file -->
    <line x1="400" y1="200" x2="400" y2="170" fill="none"/>
    <line x1="370" y1="215" x2="348" y2="195" fill="none"/>
    <line x1="430" y1="215" x2="452" y2="195" fill="none"/>
  </g>
</svg>
