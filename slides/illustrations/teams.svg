<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <g fill="#e8edf2" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground line -->
    <line x1="40" y1="410" x2="760" y2="410" fill="none"/>

    <!-- LEFT: one figure under a tottering stack of FITS cards -->
    <circle cx="170" cy="250" r="30"/>
    <path d="M120 410 V340 a50 50 0 0 1 100 0 V410 Z"/>
    <!-- arms up holding the stack -->
    <line x1="125" y1="330" x2="105" y2="230" fill="none"/>
    <line x1="215" y1="330" x2="235" y2="230" fill="none"/>
    <!-- stack, each card a little more tilted -->
    <rect x="100" y="196" width="140" height="28" rx="6"/>
    <rect x="98" y="164" width="140" height="28" rx="6" transform="rotate(-3 168 178)"/>
    <rect x="104" y="132" width="140" height="28" rx="6" transform="rotate(4 174 146)"/>
    <rect x="96" y="100" width="140" height="28" rx="6" transform="rotate(-7 166 114)"/>
    <rect x="110" y="68" width="140" height="28" rx="6" transform="rotate(10 180 82)"/>
    <rect x="92" y="36" width="140" height="28" rx="6" transform="rotate(-14 162 50)"/>
    <!-- sweat drops -->
    <path d="M225 262 q8 -14 16 0 a8 8 0 1 1 -16 0 Z" fill="#1e3a5f"/>

    <!-- divider -->
    <line x1="330" y1="60" x2="330" y2="390" fill="none" stroke-dasharray="14 14"/>

    <!-- RIGHT: three figures, each with a small stack -->
    <!-- figure 1 -->
    <circle cx="440" cy="300" r="26"/>
    <path d="M398 410 V370 a42 42 0 0 1 84 0 V410 Z"/>
    <rect x="392" y="236" width="96" height="22" rx="5"/>
    <rect x="392" y="210" width="96" height="22" rx="5"/>

    <!-- figure 2 -->
    <circle cx="570" cy="300" r="26"/>
    <path d="M528 410 V370 a42 42 0 0 1 84 0 V410 Z"/>
    <rect x="522" y="236" width="96" height="22" rx="5"/>
    <rect x="522" y="210" width="96" height="22" rx="5"/>

    <!-- figure 3 -->
    <circle cx="700" cy="300" r="26"/>
    <path d="M658 410 V370 a42 42 0 0 1 84 0 V410 Z"/>
    <rect x="652" y="236" width="96" height="22" rx="5"/>
    <rect x="652" y="210" width="96" height="22" rx="5"/>

    <!-- one shared clock above the three: time is the thing they save -->
    <circle cx="570" cy="110" r="44"/>
    <line x1="570" y1="110" x2="570" y2="80" fill="none"/>
    <line x1="570" y1="110" x2="592" y2="122" fill="none"/>
  </g>
</svg>
