<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 18 224 230">
  <g fill="#e8edf2" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- antenna, sprung -->
    <path d="M120 64 L110 54 L130 46 L118 36" fill="none"/>
    <circle cx="118" cy="28" r="7"/>

    <!-- head -->
    <rect x="56" y="64" width="128" height="104" rx="14"/>
    <line x1="68" y1="86" x2="172" y2="86" fill="none"/>

    <!-- wide eyes -->
    <circle cx="94" cy="120" r="15" fill="#fff"/>
    <circle cx="94" cy="120" r="5" fill="#1e3a5f" stroke="none"/>
    <circle cx="146" cy="120" r="15" fill="#fff"/>
    <circle cx="146" cy="120" r="5" fill="#1e3a5f" stroke="none"/>

    <!-- open mouth -->
    <ellipse cx="120" cy="150" rx="10" ry="13" fill="#fff"/>

    <!-- body and arms up -->
    <rect x="78" y="182" width="84" height="56" rx="10"/>
    <line x1="94" y1="208" x2="146" y2="208" fill="none"/>
    <line x1="78" y1="192" x2="38" y2="146" fill="none"/>
    <line x1="162" y1="192" x2="202" y2="146" fill="none"/>
    <circle cx="35" cy="141" r="8"/>
    <circle cx="205" cy="141" r="8"/>

    <!-- surprise strokes -->
    <line x1="44" y1="66" x2="28" y2="52" fill="none" stroke-width="5"/>
    <line x1="36" y1="94" x2="18" y2="88" fill="none" stroke-width="5"/>
    <line x1="196" y1="66" x2="212" y2="52" fill="none" stroke-width="5"/>
    <line x1="204" y1="94" x2="222" y2="88" fill="none" stroke-width="5"/>
  </g>
</svg>
